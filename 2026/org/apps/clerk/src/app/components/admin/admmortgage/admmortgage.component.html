@if (!editMode) {
  <div class="row">
    <div class="col-md-5"> {{ mortgage.house }}      </div>
    <button class="btn btn-success btn-toggle col-md-2" type="button"
    (click)="editMode = true"> Edit</button>
    <button class="btn btn-danger col-md-2" type="button"
    (click)="onDeleteRecord()"> Delete</button>
  </div>
}
<p style="background-color: aqua;">{{ statusMsg }}</p>
@if (editMode) {
  <div class="row">
    <div class="col-md-5">
      <div class="form-group">
        @if (newRow) {
          <div class="row">
            <label for="house">House</label>
            <select class="form-control" id="house" name="house" [(ngModel)]="mortgage.house" data-cy="amo-house">
              <option [value]="''" [selected]="!mortgage.house"> -- select an option -- </option>
              @for (house of houses; track house) {
                <option [value]="house.name">{{ house.name }}</option>
              }
            </select>
          </div>
        }
        @if (!newRow) {
          <div class="row">{{ mortgage.house }} </div>
        }
        <label for="mortRate" title="ie: 5 for 5% annually">Mortgage Rate</label>
        <input type="number" class="form-control" [(ngModel)]="mortgage.rate" name="mortRate" id="mortRate"
          ngModel data-cy="amo-rate">
        <label for="mortTerm" title="Number of years for mortgage (30/15/10/..)">Mortgage Term</label>
        <input type="number" class="form-control" [(ngModel)]="mortgage.lterm" name="mortTerm" id="mortTerm"
          ngModel data-cy="amo-term">
        <label for="mortPmt" title="Amount paid monthly (including escrow and extra principal)">Mortgage Payment (monthly)</label>
        <input type="number" class="form-control" [(ngModel)]="mortgage.lpmt" name="mortPmt" id="mortPmt"
          ngModel data-cy="amo-pmt">
        <label for="balDate" title="Date of a known balance (ie: after disrupting events)">Date of Ref Balance</label>
        <input type="date" class="form-control" [(ngModel)]="mortgage.balDate" name="balDate" id="balDate"
          ngModel data-cy="amo-balDate  ">
        <label for="curBal" title="Balance on the reference date">Balance on Ref Date</label>
        <input type="number" class="form-control" [(ngModel)]="mortgage.cBal" name="curBal" id="curBal"
          ngModel data-cy="amo-curBal">
        <button class="btn btn-success col-md-3" type="button" data-cy="amo-add" (click)="onAddRecord()">
        {{ newRow ? 'Add' : 'Update' }}</button>
        <button class="btn btn-primary col-md-3" type="button" data-cy="amo-cancel"
        (click)="onCancel()">Cancel</button>
      </div>
    </div>
  </div>
}
